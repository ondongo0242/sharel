name: Build Android arm64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (android)
        run: npx expo prebuild --clean --platform android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '9477386'
          accept-android-sdk-licenses: true
          packages: >-
            platforms;android-33
            build-tools;35.0.0
            ndk;27.1.12297006
            cmake;3.22.1
            platform-tools

      - name: Build Android AAB (release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --warning-mode all --info

      - name: Upload Gradle Problems Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-problems-report
          path: android/build/reports/problems

      - name: Download bundletool
        run: |
          curl -L -o bundletool.jar https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar

      - name: Create arm64 device spec
        run: |
          cat > device-arm64.json <<'JSON'
          {
            "supportedAbis": ["arm64-v8a"],
            "sdkVersion": 33,
            "screenDensity": 420
          }
          JSON

      - name: Build APKS (arm64)
        run: |
          java -jar bundletool.jar build-apks \
            --bundle=android/app/build/outputs/bundle/release/app-release.aab \
            --output=app-arm64.apks \
            --overwrite \
            --device-spec=device-arm64.json

      - name: Extract APK
        run: |
          unzip -o app-arm64.apks -d apks_out
          APK=$(find apks_out -name "*.apk" | head -n 1)
          echo "APK_FILE=$APK" >> $GITHUB_ENV
          cp "$APK" unsigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sharel-arm64-unsigned-apk
          path: unsigned.apk
